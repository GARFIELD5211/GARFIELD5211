<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="100%" height="100%">
  <rect width="1000" height="60" fill="#000000" />
  <!-- Minimalist bottom border -->
  <line x1="0" y1="59" x2="1000" y2="59" stroke="#333333" stroke-width="1" />
  
  <!-- Network Status Dot -->
  <circle cx="30" cy="30" r="4" fill="#00F7FF">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <text x="50" y="35" font-family="monospace" font-size="14" fill="#888888" letter-spacing="2">NEXUS_OS // KERNEL v2.0.26</text>
  
  <!-- Right side telemetry -->
  <text x="970" y="35" font-family="monospace" font-size="12" fill="#666666" text-anchor="end">SYS.UPTIME: ONLINE</text>
  <rect x="830" y="25" width="2" height="10" fill="#333" />
</svg>
