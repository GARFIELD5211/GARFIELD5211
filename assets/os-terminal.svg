<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Glassmorphic Card Background -->
  <rect width="600" height="400" rx="8" fill="#0A0A0A" stroke="#222222" stroke-width="1" />
  
  <!-- Terminal Window Controls -->
  <circle cx="25" cy="25" r="5" fill="#333" />
  <circle cx="45" cy="25" r="5" fill="#333" />
  <circle cx="65" cy="25" r="5" fill="#333" />
  <line x1="0" y1="50" x2="600" y2="50" stroke="#1A1A1A" stroke-width="1" />

  <g font-family="monospace" font-size="13" fill="#EEDEDE">
    <!-- ASCII Art (Animated to fade in) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze" />
      <text x="30" y="90" fill="#7B61FF">  _   _ ________   ___    _  _____ </text>
      <text x="30" y="105" fill="#7B61FF"> | \ | |  ____\ \ / / |  | |/ ____|</text>
      <text x="30" y="120" fill="#7B61FF"> |  \| | |__   \ V /| |  | | (___  </text>
      <text x="30" y="135" fill="#7B61FF"> | . ` |  __|   &gt; &lt; | |  | |\___ \ </text>
      <text x="30" y="150" fill="#7B61FF"> | |\  | |____ / . \| |__| |____) |</text>
      <text x="30" y="165" fill="#7B61FF"> |_| \_|______/_/ \_\\____/|_____/ </text>
    </g>

    <!-- Typing sequence -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.2s" fill="freeze" />
      <text x="30" y="210" fill="#00F7FF">&gt; root@nexus:~$</text>
      <text x="160" y="210" fill="#888"> ./fetch_identity.sh</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.8s" fill="freeze" />
      <text x="30" y="240">[IDENT] M.SAAD MALIK</text>
      <text x="30" y="260">[ID_NO] 01-134242-089</text>
      <text x="30" y="280">[ROLE_] FULL STACK / HARDWARE ENGINEER</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.4s" fill="freeze" />
      <text x="30" y="320" fill="#00F7FF">&gt; root@nexus:~$</text>
      <text x="160" y="320" fill="#888"> tail -f /var/log/projects.log</text>
    </g>

    <!-- Blinking Cursor -->
    <rect x="30" y="340" width="8" height="15" fill="#EEDEDE" opacity="0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
