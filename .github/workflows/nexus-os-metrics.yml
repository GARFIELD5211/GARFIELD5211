name: NEXUS OS Telemetry
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Force the Vercel/Linear dark aesthetic
          config_theme: dark
          base: activity, repositories
          plugin_languages: yes
          plugin_languages_colors: "0:0070F3, 1:7B61FF, 2:00F7FF, 3:F5A623"
          plugin_languages_limit: 4
          # Strip down the ugly borders to fit the OS grid
          config_padding: 0
          style: flat